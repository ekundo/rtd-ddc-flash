  <text x="60" y="96" font-size="15" font-weight="bold" fill="#2c2c2a">Arduino Uno</text>
  <text x="60" y="256" font-size="12" fill="#5f5e5a">USB to the computer</text>
  <text x="218" y="114" font-size="14" text-anchor="end" fill="#2c2c2a">GND</text>
  <text x="218" y="174" font-size="14" text-anchor="end" fill="#2c2c2a">A5 (SCL)</text>
  <text x="218" y="234" font-size="14" text-anchor="end" fill="#2c2c2a">A4 (SDA)</text>
  <rect x="226" y="105" width="8" height="10" fill="#444441"/>
  <rect x="226" y="165" width="8" height="10" fill="#444441"/>
  <rect x="226" y="225" width="8" height="10" fill="#444441"/>
  <path d="M234 110 L320 110 L320 165 L420 165" fill="none" stroke="#5f5e5a" stroke-width="2.5"/>
  <path d="M234 170 L300 170 L300 255 L440 255 L440 215" fill="none" stroke="#1d9e75" stroke-width="2.5"/>
  <path d="M234 230 L280 230 L280 280 L560 280 L560 215" fill="none" stroke="#7f77dd" stroke-width="2.5"/>
  <path d="M405 100 L625 100 L610 230 L420 230 Z" fill="none" stroke="#2c2c2a" stroke-width="1.2"/>
  <g font-size="11" text-anchor="middle" fill="#2c2c2a">
