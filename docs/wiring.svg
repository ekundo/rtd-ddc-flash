<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="380" fill="#ffffff"/>
  <rect x="40" y="70" width="190" height="200" rx="8" fill="#f1efe8" stroke="#888780"/>
  <text x="60" y="96" font-size="15" font-weight="bold" fill="#2c2c2a">Arduino Uno</text>
  <text x="60" y="256" font-size="12" fill="#5f5e5a">USB to the computer</text>
  <text x="218" y="114" font-size="14" text-anchor="end" fill="#2c2c2a">GND</text>
  <text x="218" y="174" font-size="14" text-anchor="end" fill="#2c2c2a">A4 (SDA)</text>
  <text x="218" y="234" font-size="14" text-anchor="end" fill="#2c2c2a">A5 (SCL)</text>
  <rect x="226" y="105" width="8" height="10" fill="#444441"/>
  <rect x="226" y="165" width="8" height="10" fill="#444441"/>
  <rect x="226" y="225" width="8" height="10" fill="#444441"/>
  <path d="M234 110 L370 110 L370 62 L665 62 L665 165 L620 165" fill="none" stroke="#5f5e5a" stroke-width="2.5"/>
  <path d="M234 170 L300 170 L300 260 L480 260 L480 215" fill="none" stroke="#7f77dd" stroke-width="2.5"/>
  <path d="M234 230 L270 230 L270 300 L650 300 L650 205 L610 205" fill="none" stroke="#1d9e75" stroke-width="2.5"/>
  <path d="M395 100 L645 100 L630 230 L410 230 Z" fill="none" stroke="#2c2c2a" stroke-width="1.2"/>
  <g font-size="11" text-anchor="middle" fill="#2c2c2a">
    <circle cx="440" cy="125" r="10" fill="none" stroke="#888780"/><text x="440" y="129">1</text>
    <circle cx="480" cy="125" r="10" fill="none" stroke="#888780"/><text x="480" y="129">2</text>
    <circle cx="520" cy="125" r="10" fill="none" stroke="#888780"/><text x="520" y="129">3</text>
    <circle cx="560" cy="125" r="10" fill="none" stroke="#888780"/><text x="560" y="129">4</text>
    <circle cx="600" cy="125" r="10" fill="#fcebeb" stroke="#a32d2d"/><text x="600" y="129">5</text>
    <circle cx="450" cy="165" r="10" fill="none" stroke="#888780"/><text x="450" y="169">6</text>
    <circle cx="490" cy="165" r="10" fill="none" stroke="#888780"/><text x="490" y="169">7</text>
    <circle cx="530" cy="165" r="10" fill="none" stroke="#888780"/><text x="530" y="169">8</text>
    <circle cx="570" cy="165" r="10" fill="none" stroke="#888780"/><text x="570" y="169">9</text>
    <circle cx="610" cy="165" r="10" fill="#d3d1c7" stroke="#444441"/><text x="610" y="169">10</text>
    <circle cx="440" cy="205" r="10" fill="none" stroke="#888780"/><text x="440" y="209">11</text>
    <circle cx="480" cy="205" r="10" fill="#eeedfe" stroke="#534ab7"/><text x="480" y="209">12</text>
    <circle cx="520" cy="205" r="10" fill="none" stroke="#888780"/><text x="520" y="209">13</text>
    <circle cx="560" cy="205" r="10" fill="none" stroke="#888780"/><text x="560" y="209">14</text>
    <circle cx="600" cy="205" r="10" fill="#e1f5ee" stroke="#0f6e56"/><text x="600" y="209">15</text>
  </g>
  <text x="520" y="34" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c2c2a">VGA cable plug, pins facing you</text>
  <text x="350" y="332" font-size="12" text-anchor="middle" fill="#5f5e5a">The free end of a VGA cable plugged into the monitor, wide side up. The monitor's own socket is the mirror image.</text>
  <text x="350" y="354" font-size="12" text-anchor="middle" fill="#5f5e5a">12 = SDA, 15 = SCL, 10 = ground. Pin 5 is NOT ground on some monitors; pin 9 (+5 V) is not needed.</text>
</svg>
