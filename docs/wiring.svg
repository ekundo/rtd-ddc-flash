    <circle cx="560" cy="125" r="10" fill="none" stroke="#888780"/><text x="560" y="129">2</text>
    <circle cx="600" cy="125" r="10" fill="none" stroke="#888780"/><text x="600" y="129">1</text>
    <circle cx="430" cy="165" r="10" fill="#d3d1c7" stroke="#444441"/><text x="430" y="169">10</text>
