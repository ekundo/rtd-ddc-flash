  <text x="515" y="84" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c2c2a">VGA socket of the monitor</text>
  <text x="340" y="314" font-size="12" text-anchor="middle" fill="#5f5e5a">Socket seen from the front, wide side up. On a cable plug (pins) the numbering is mirrored.</text>
  <text x="340" y="336" font-size="12" text-anchor="middle" fill="#5f5e5a">12 = SDA, 15 = SCL, 10 = ground. Pin 5 is NOT ground on some monitors; pin 9 (+5 V) is not needed.</text>
